services:
  sentrame:
    image: ${SENTRAME_IMAGE:?Set SENTRAME_IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    volumes:
      - type: bind
        source: ${SENTRAME_DATA_DIR:?Set SENTRAME_DATA_DIR in .env}
        target: /data
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${SENTRAME_PORT:-8096}:8096"
